[project]
name = "orbit"
version = "1"
description = "A local-first agentic coding runtime."
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "qdrant-client>=1.19.0",
    "rich>=13.7.0",
    "sentence-transformers>=5.7.0",
    "typer>=0.16.0",
]

[project.scripts]
orbit = "orbit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]
